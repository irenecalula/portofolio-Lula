<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portofolio Irene Calula</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Courier+Prime:wght@400;700&family=DM+Sans:wght@400;500;700&family=Pinyon+Script&family=Cormorant+Garamond:wght@500;600;700&display=swap">
<style>
/* Layout: scrapbook feminin. Hero polaroid bertumpuk, marquee tipis, kartu "tiket" tentang aku,
   galeri polaroid yang bisa difilter, web project, panel cokelat untuk kolaborasi, section polkadot pink, panel kontak. */
:root{
  --bg:#fcf0f0; --fg:#2c1b1d; --muted:#7a6466; --card:#fffdf8; --line:#e8d9cc;
  --pink:#f0c3cb; --pink-deep:#b34d6b; --pink-soft:#f6d5da; --dot:rgba(44,27,29,.32);
  --butter:#f7df8e; --butter-deep:#e8bf4a; --wine:#8a3550; --lead:#8f6600;
  --sage:#dfe8d0; --sage-deep:#6b8350; --mesh-pink:#f8d3da; --mesh-sage:#dfe9d0;
  --gi-a:rgba(130,165,105,.20); --gi-b:rgba(232,140,165,.20);
  --mesh:radial-gradient(520px 420px at 6% 5%,var(--mesh-pink),transparent 70%),radial-gradient(560px 460px at 96% 24%,var(--mesh-sage),transparent 70%),radial-gradient(620px 480px at 14% 60%,var(--mesh-sage),transparent 70%),radial-gradient(540px 440px at 94% 84%,var(--mesh-pink),transparent 70%);
  --panel:#2c1b1d; --panel-fg:#fbf5ea; --panel-muted:#cdb6b2;
  --ink-bg:#2c1b1d; --ink-fg:#fbf5ea;
  --paper:#fffaf1; --paper-ink:#2c1b1d; --paper-line:#d9c7b6;
  --prev:var(--bg);
  --f-display:"Bodoni Moda","Didot",Georgia,serif;
  --f-script:"Pinyon Script","Snell Roundhand",cursive;
  --f-mono:"Courier Prime","Courier New",monospace;
  --f-body:"DM Sans",system-ui,sans-serif;
  --f-elegant:"Cormorant Garamond","Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1f1416; --fg:#f7ece0; --muted:#b99fa2; --card:#2b1c1f; --line:#3d2a2d;
  --pink:#e8a9b6; --pink-deep:#f0b4c1; --pink-soft:#35222a; --dot:rgba(247,236,224,.13);
  --panel:#140c0d; --panel-fg:#f7ece0; --panel-muted:#b99fa2;
  --ink-bg:#e8a9b6; --ink-fg:#1f1416; --lead:#f7df8e; --mesh-pink:rgba(232,169,182,.10); --mesh-sage:rgba(150,185,140,.09); --sage:#7f9a70; --sage-deep:#9bb88a; --gi-a:rgba(150,185,140,.10); --gi-b:rgba(232,169,182,.10); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f1416; --fg:#f7ece0; --muted:#b99fa2; --card:#2b1c1f; --line:#3d2a2d;
  --pink:#e8a9b6; --pink-deep:#f0b4c1; --pink-soft:#35222a; --dot:rgba(247,236,224,.13);
  --panel:#140c0d; --panel-fg:#f7ece0; --panel-muted:#b99fa2;
  --ink-bg:#e8a9b6; --ink-fg:#1f1416; --lead:#f7df8e; --mesh-pink:rgba(232,169,182,.10); --mesh-sage:rgba(150,185,140,.09); --sage:#7f9a70; --sage-deep:#9bb88a; --gi-a:rgba(150,185,140,.10); --gi-b:rgba(232,169,182,.10); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background-color:var(--bg);background-image:var(--mesh);background-size:100% 1700px;background-repeat:repeat-y;color:var(--fg);font:400 16px/1.65 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
main{overflow-x:clip}
section{scroll-margin-top:72px}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pink-deep);outline-offset:3px}
::selection{background:var(--butter);color:#2c1b1d}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* nav (lebih tinggi + tombol 44px biar gampang dipencet di HP) */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.navin{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;min-width:0}
.brand{font:400 1.7rem/1 var(--f-script);color:var(--pink-deep);text-decoration:none;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.links{display:flex;align-items:center;gap:22px;flex:none}
.links a{font:700 .74rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--muted)}
.links a:hover{color:var(--fg)}
.iconbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer}
.iconbtn svg{width:20px;height:20px;fill:currentColor}
.menubtn{display:none}
.mpanel{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 18px 24px -18px rgba(44,27,29,.45)}
.mpanel.on{display:block}
.mpanel a{display:block;padding:15px 4px;font:700 .85rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--fg);border-top:1px dashed var(--line)}
.mpanel a:first-child{border-top:0}
@media (max-width:700px){
  .links a.hide-s{display:none}
  .links{gap:8px}
  .links a:not(.hide-s){padding:12px 10px}
  .brand{font-size:1.5rem}
  .menubtn{display:grid}
}

/* buttons, pills */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;border:1.5px solid var(--ink-bg);background:var(--ink-bg);color:var(--ink-fg);font:700 .82rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(44,27,29,.55)}
.btn:active,.chip:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);font:700 .74rem var(--f-mono);letter-spacing:.04em}
.dot{width:8px;height:8px;border-radius:50%;background:#4faa73;animation:ping 2.2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(79,170,115,.55)}70%,100%{box-shadow:0 0 0 8px rgba(79,170,115,0)}}

/* polaroid */
.pol{display:block;position:relative;background:var(--paper);color:var(--paper-ink);padding:9px 9px 11px;border:0;text-align:left;
  box-shadow:0 12px 26px -12px rgba(44,27,29,.55),0 1px 0 rgba(0,0,0,.04);transform:rotate(var(--r,0deg));
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
button.pol{cursor:pointer;width:100%}
.pol:hover{transform:rotate(0) translateY(-4px) scale(1.02);z-index:5}
.pol .cap{display:block;padding-top:9px;font:700 .72rem/1.2 var(--f-mono);letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pic{position:relative;overflow:hidden;background:#efe3d4;aspect-ratio:3/4}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px}
.ph svg{width:42%;fill:rgba(255,255,255,.72)}
.ph span{font:700 .66rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(44,27,29,.55)}
.video-mark{position:absolute;right:10px;bottom:10px;padding:6px 10px;border-radius:20px;background:rgba(44,27,29,.8);color:#fff;font:700 .65rem var(--f-mono);z-index:2}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding-block:52px 72px}
.eyebrow{font:700 .74rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:14px 0 0;font:500 clamp(2.6rem,7.4vw,5rem)/.95 var(--f-display);letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance}
h1 em{display:block;font-style:normal;color:var(--pink-deep)}
.hl{background:linear-gradient(transparent 58%,var(--butter) 58% 90%,transparent 90%);padding:0 .1em;margin-left:-.1em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.myname{display:flex;align-items:center;gap:14px;margin:28px 0 0;font:600 clamp(.95rem,2vw,1.2rem)/1.3 var(--f-elegant);letter-spacing:.32em;text-transform:uppercase;color:var(--pink-deep)}
.myname::before{content:"";flex:none;width:38px;height:2px;background:var(--sage-deep)}
.lead{max-width:46ch;margin:18px 0 22px;color:var(--lead);font-size:1.06rem;font-weight:500}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.stack{position:relative;width:100%;max-width:440px;aspect-ratio:1/1.12;margin-inline:auto}
.stack .pol{position:absolute}
.s1{left:22%;top:2%;width:56%;--r:3deg;z-index:2}
.s2{left:0;bottom:0;width:44%;--r:-6deg;z-index:3}
.s3{right:0;top:32%;width:40%;--r:7deg;z-index:1}
.s1::before{content:"";position:absolute;top:-11px;left:50%;width:74px;height:22px;transform:translateX(-50%) rotate(-3deg);background:color-mix(in srgb,var(--sage) 88%,transparent);z-index:3}
.charm{position:absolute;width:34px;height:34px;color:var(--pink-deep);z-index:6;filter:drop-shadow(0 3px 4px rgba(44,27,29,.25));pointer-events:none}
.charm svg{width:100%;height:100%;fill:currentColor}
.c1{left:1%;top:6%;transform:rotate(-14deg)}
.c2{right:5%;bottom:7%;width:40px;height:40px;transform:rotate(12deg)}
.c3{right:10%;top:-3%;width:32px;height:32px;transform:rotate(8deg)}
.charm.butter svg{fill:var(--butter);stroke:var(--pink-deep);stroke-width:1.2;stroke-linejoin:round}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:34px;padding-block:36px 56px}.stack{max-width:380px}}

/* marquee */
.marq{overflow:hidden;border-block:1px solid var(--line);padding-block:12px;background-color:var(--card);background-image:repeating-linear-gradient(0deg,var(--gi-a) 0 12px,transparent 12px 24px),repeating-linear-gradient(90deg,var(--gi-b) 0 12px,transparent 12px 24px)}
.track{display:flex;width:max-content;gap:28px;animation:marq 34s linear infinite}
.marq:hover .track{animation-play-state:paused}
.track span{display:inline-flex;align-items:center;gap:28px;font:italic 500 1.25rem var(--f-display);white-space:nowrap}
.track i{width:8px;height:8px;border-radius:50%;background:var(--pink-deep);display:inline-block}
.track i.y{background:var(--butter-deep)}
@keyframes marq{to{transform:translateX(calc(-50% - 14px))}}

/* sections */
.sec{padding-block:84px 24px}
.shead{margin-bottom:34px}
h2{margin:10px 0 0;font:500 clamp(2rem,5vw,3.1rem)/1.05 var(--f-display);text-transform:uppercase;text-wrap:balance}
h2 .sc{font:400 1.35em/1 var(--f-script);text-transform:none;color:var(--pink-deep);padding-left:.12em}

/* about */
.about{display:grid;grid-template-columns:.8fr 1.2fr;gap:44px;align-items:center}
.about .pol{max-width:340px;margin-inline:auto;--r:-3deg}
.about p{margin:0 0 14px;color:var(--muted)}
.ticket{position:relative;margin-top:22px;background:var(--paper);color:var(--paper-ink);padding:26px 24px 20px;box-shadow:0 14px 28px -16px rgba(44,27,29,.5)}
.ticket::before{content:"";position:absolute;top:-10px;left:22px;width:70px;height:22px;transform:rotate(-5deg);background:color-mix(in srgb,var(--butter) 85%,transparent)}
.ticket h3{margin:0 0 2px;text-align:center;font:500 1rem var(--f-display);letter-spacing:.14em;text-transform:uppercase}
.ticket .handle{display:block;text-align:center;font:400 .72rem var(--f-mono);color:#7a6466;margin-bottom:14px}
.ticket dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.ticket div{padding:9px 0;border-top:1px dashed var(--paper-line);min-width:0}
.ticket dt{font:700 .64rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#7a6466}
.ticket dd{margin:2px 0 0;font:400 .86rem/1.35 var(--f-mono);overflow-wrap:anywhere}
@media (max-width:820px){.about{grid-template-columns:1fr;gap:34px}}
@media (max-width:420px){.ticket dl{grid-template-columns:1fr}}

/* works */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px}
.chip{padding:8px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font:700 .76rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip:hover{border-color:var(--pink-deep)}
.chip[aria-pressed="true"]{background:var(--ink-bg);color:var(--ink-fg);border-color:var(--ink-bg)}
.masonry{columns:3;column-gap:22px}
.masonry .pol{break-inside:avoid;margin:0 0 22px}
@media (max-width:860px){.masonry{columns:2;column-gap:16px}.masonry .pol{margin-bottom:16px}}

/* web project */
.webp{display:grid;grid-template-columns:auto 1fr;gap:44px;align-items:center;max-width:820px;margin-inline:auto}
.phone{position:relative;width:250px;aspect-ratio:9/18;border:9px solid #2c1b1d;border-radius:36px;background:#fff;overflow:hidden;box-shadow:0 22px 40px -18px rgba(44,27,29,.6);animation:bob 6s ease-in-out infinite}
.phone::before{content:"";position:absolute;top:0;left:50%;width:70px;height:16px;transform:translateX(-50%);background:#2c1b1d;border-radius:0 0 12px 12px;z-index:2}
.phone iframe{display:block;width:100%;height:100%;border:0;background:#fff}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
.webinfo{transform:rotate(.6deg)}
.webinfo p{margin:0 0 12px;font-size:.92rem;color:#5b4749}
.webinfo .brandname{font-size:2rem;color:var(--pink-deep)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
.tags span{padding:4px 11px;border-radius:999px;background:var(--butter);color:#2c1b1d;font:700 .64rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.webinfo .btn{background:#2c1b1d;border-color:#2c1b1d;color:#fbf5ea}
.webinfo small{display:block;margin-top:12px;font:400 .7rem var(--f-mono);color:#7a6466}
@media (max-width:760px){.webp{grid-template-columns:1fr;gap:34px;justify-items:center}.webinfo{width:100%}}

/* panels */
.panel{position:relative;background:var(--panel);color:var(--panel-fg);padding-block:92px 72px;margin-top:84px}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:radial-gradient(circle at 8px 0,var(--prev) 8px,transparent 8.5px) 0 0/16px 9px repeat-x}
.panel h2 .sc{color:var(--butter)}
.panel .eyebrow{color:var(--panel-muted)}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:26px}
.note{position:relative;background:var(--paper);color:var(--paper-ink);padding:22px 20px 18px;box-shadow:0 14px 28px -14px rgba(0,0,0,.6)}
.note:nth-child(odd){transform:rotate(-.7deg)}.note:nth-child(even){transform:rotate(.6deg)}
.note .tag{display:block;font:700 .62rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#7a6466;margin-bottom:2px}
.note .brandname{font:400 1.8rem/1.15 var(--f-script);color:var(--pink-deep);margin:0 0 8px}
.note dl{margin:0}
.note dl div{padding:8px 0;border-top:1px dashed var(--paper-line)}
.note dt{font:700 .62rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#7a6466}
.note dd{margin:2px 0 0;font:400 .84rem/1.4 var(--f-mono)}
.stats{display:flex;gap:22px;flex-wrap:wrap;border-top:1.5px solid var(--paper-ink);padding-top:12px;margin-top:6px}
.stats b{display:block;width:fit-content;padding:0 3px;font:700 1.3rem/1.1 var(--f-display);background:linear-gradient(transparent 58%,var(--butter) 58% 92%,transparent 92%)}
.stats span{font:700 .6rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:#7a6466}

/* services, polka */
.dots{padding-block:84px 84px;background:var(--pink-soft);background-image:radial-gradient(var(--dot) 2px,transparent 2.6px);background-size:24px 24px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.lvl{padding:4px 11px;border-radius:999px;font:700 .62rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#2c1b1d;background:var(--sage);white-space:nowrap}
.lvl.butter{background:var(--butter)}
.lvl.pink{background:var(--pink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;min-width:0}
.card .charm{position:static;display:grid;place-items:center;width:46px;height:46px;padding:11px;margin:0;border-radius:50%;background:var(--butter);color:var(--wine);transform:none;filter:none}
.card h3{margin:0 0 6px;font:500 1.2rem/1.2 var(--f-display)}
.card p{margin:0;color:var(--muted);font-size:.94rem}
.rate{margin-top:28px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.rate .eyebrow{background:var(--pink-soft);padding:3px 8px;border-radius:6px}

/* contact */
.contact{text-align:center;max-width:640px;margin-inline:auto}
.contact .big{font:400 clamp(3rem,10vw,5.2rem)/1 var(--f-script);color:var(--butter);margin:6px 0 10px}
.contact p{color:var(--panel-muted);margin:0 auto 24px;max-width:46ch}
.mail{display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;padding:8px 8px 8px 20px;border:1.5px solid var(--panel-muted);border-radius:999px;font:700 .95rem var(--f-mono);overflow-wrap:anywhere}
.mail button{padding:8px 16px;border-radius:999px;border:0;background:var(--butter);color:#2c1b1d;font:700 .74rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.socials{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.socials a{padding:9px 18px;border-radius:999px;border:1.5px solid var(--panel-muted);text-decoration:none;font:700 .76rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;transition:background .2s,color .2s}
.socials a:hover{background:var(--panel-fg);color:var(--panel)}
.wa{margin-top:28px}
.wa .eyebrow{display:block;margin-bottom:12px}
.wa .socials{margin-top:0}
.wa .socials a{background:var(--butter);border-color:var(--butter);color:#2c1b1d}
.wa .socials a:hover{background:var(--panel-fg);border-color:var(--panel-fg)}
.contact .pill{background:transparent;border-color:var(--panel-muted);color:var(--panel-fg);margin-bottom:8px}
.foot{margin-top:64px;padding-top:20px;border-top:1px solid color-mix(in srgb,var(--panel-fg) 18%,transparent);text-align:center;font:400 .74rem var(--f-mono);color:var(--panel-muted)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(20,12,13,.8);
  padding:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
.lb-in{position:relative;width:min(100%,400px);--r:-1deg}
.lb-in.pol,.lb-in.pol:hover{transform:none}
.lb-in .pic{max-height:62vh}
.lb-in h3{margin:10px 0 0;font:500 1.15rem var(--f-display)}
.lb-meta{font:700 .68rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:#7a6466}
.lb-note{margin:4px 0 0;font-size:.9rem;color:#5b4749}
.lb-btn{position:absolute;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;border:0;background:var(--butter);color:#2c1b1d;font-size:1.1rem;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.lb-prev{left:-14px}.lb-next{right:-14px}
.lb-close{position:absolute;top:-14px;right:-14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--ink-bg);color:var(--ink-fg);cursor:pointer;z-index:2;font-size:1rem}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink-bg);color:var(--ink-fg);padding:10px 18px;border-radius:999px;font:700 .78rem var(--f-mono);z-index:60;transition:opacity .25s,transform .25s;max-width:90vw;text-align:center}

html,body{overflow-x:clip}

/* ===== bunga lily + animasi kecil ===== */
.fl-defs{position:absolute;width:0;height:0}
.fl-layer{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.fl{position:absolute;width:var(--s);height:var(--s);opacity:.5;will-change:transform}
:root[data-theme="dark"] .fl{opacity:.32}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fl{opacity:.32}}
@media (max-width:700px){.fl{width:calc(var(--s)*.62);height:calc(var(--s)*.62)}}
.fl svg,.lily svg{display:block;width:100%;height:100%;transform-origin:50% 60%;animation:sway 7s ease-in-out infinite}
.fl:nth-child(even) svg{animation-duration:9s;animation-delay:-3s}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.lily{position:absolute;z-index:6;width:84px;height:84px;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 4px 5px rgba(44,27,29,.22))}
.lily:hover{transform:scale(1.12) rotate(10deg)}
.lily.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-14deg)}100%{transform:scale(1)}}
.lily.a{left:-7%;top:-6%}
.lily.b{right:-5%;bottom:-5%;width:68px;height:68px}
@media (max-width:700px){.lily{width:64px;height:64px}.lily.b{width:54px;height:54px}}
.card .charm{transition:transform .3s}
.card:hover .charm{animation:wig .6s ease}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) scale(1.1)}60%{transform:rotate(12deg) scale(1.1)}}
.rv{opacity:0;translate:0 22px;transition:opacity .7s ease,translate .7s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;translate:0 0}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .track,.dot,.fl svg,.lily svg,.phone{animation:none}
  .pol,.btn,.toast{transition:none}
  .rv{opacity:1;translate:none;transition:none}
}

const SIL = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 22c.6-5.2 4-8 8.5-8s7.9 2.8 8.5 8z"/></svg>';
const TONES = [
  "linear-gradient(160deg,#f6d5da,#e7a9b8)", "linear-gradient(160deg,#efe3d0,#f0c3cb)",
  "linear-gradient(160deg,#e9c5cf,#c98a9d)", "linear-gradient(160deg,#f8e8dc,#e9b9c2)"
];

/* ---------- loader file: tahan folder berantakan ---------- */
const IMG_EXT = ["jpg", "jpeg", "png", "webp", "JPG", "JPEG", "PNG"];
const VID_EXT = ["mp4", "MP4"];
const fileName = p => String(p || "").split("/").pop();
function variants(p, exts) {
  const m = p.match(/^(.*)\.([^./]+)$/);
  const stem = m ? m[1] : p, ext = m ? m[2] : "";
  return [...new Set([ext, ...exts].filter(Boolean).map(e => stem + "." + e))];
}
function candidates(src, exts) {
  if (!src) return [];
  return [...new Set([...variants(src, exts), ...variants(fileName(src), exts)])];
}
function phHtml(i, hint) {
  return '<div class="ph" style="background:' + TONES[i % TONES.length] + '">' + SIL + "<span>" + esc(hint) + "</span></div>";
}

function pic(src, i, alt, ratio) {
  const d = document.createElement("div");
  d.className = "pic";
  if (ratio) d.style.aspectRatio = ratio;
  const fallback = () => { d.innerHTML = phHtml(i, src ? "cek file: " + fileName(src) : "foto kamu"); };
  if (src) {
    const im = new Image();
    im.alt = alt || "";
    im.loading = "lazy";
    const list = candidates(src, IMG_EXT);
    let n = 0;
    im.onerror = () => {
      if (n < list.length) im.src = list[n++];
      else { im.remove(); fallback(); }
    };
    im.onerror();
    d.appendChild(im);
  } else fallback();
  return d;
}
function polaroid(tag, cls, photo, i, caption, ratio) {
  const p = document.createElement(tag);
  p.className = "pol " + cls;
  p.append(pic(photo, i, caption, ratio));
  const c = document.createElement("span");
  c.className = "cap";
  c.textContent = caption;
  p.append(c);
  return p;
}
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove("on"), 2200);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("Udah ke-copy: " + text); return; } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    toast(ok ? "Udah ke-copy: " + text : "Copy manual ya: " + text);
  } catch (e) { toast("Copy manual ya: " + text); }
}

    const p = polaroid("button", "", w.video ? "" : w.photo, SITE.works.indexOf(w), w.title, w.ratio);
    p.type = "button";
    p.setAttribute("aria-label", "Buka " + w.title);
    p.style.setProperty("--r", ((k % 5) - 2) * 0.9 + "deg");

    if (w.video) {

      video.muted = true;

      video.preload = "metadata";
      const vlist = candidates(w.video, VID_EXT);
      let vn = 0;
      video.onerror = () => {
        if (vn < vlist.length) video.src = vlist[vn++] + "#t=0.1";
        else { video.remove(); picArea.insertAdjacentHTML("afterbegin", phHtml(SITE.works.indexOf(w), "cek file: " + fileName(w.video))); }
      };
      video.onerror();
      picArea.append(video);
      const mark = document.createElement("span");
      mark.className = "video-mark";
      mark.textContent = "▶ VIDEO";
      picArea.append(mark);
    }

    p.onclick = () => openLb(k);
    g.append(p);
  });
}

/* ---------- lightbox ---------- */
const lb = $("#lb");

function paintLb() {
  const w = list[cur];
  const box = $("#lbPic");
  box.innerHTML = "";

  if (w.video) {
    const player = document.createElement("video");
    const vlist = candidates(w.video, VID_EXT);
    let vn = 0;
    player.controls = true;
    player.playsInline = true;
    player.setAttribute("playsinline", "");
    player.preload = "auto";
    player.style.cssText = "display:block;width:100%;max-height:62vh;object-fit:contain;background:#1b1012";
    player.onerror = () => {
      if (vn < vlist.length) player.src = vlist[vn++];
      else box.innerHTML = '<div class="vfail">Video belum bisa diputar. Cek nama file ("' + esc(fileName(w.video)) + '") dan pastikan formatnya MP4 (H.264).</div>';
    };
    player.onerror();
    box.append(player);
    const pr = player.play();
    if (pr && pr.catch) pr.catch(() => {});
  } else {
    box.append(pic(w.photo, SITE.works.indexOf(w), w.title, w.ratio || "3/4"));
  }

  $("#lbTitle").textContent = w.title;
  $("#lbMeta").textContent = w.cat + " · " + (cur + 1) + "/" + list.length;
  $("#lbNote").textContent = w.note || "";
}
function stopLbVideo() { const v = $("#lbPic video"); if (v) v.pause(); }
function openLb(k) {
  cur = k;
  paintLb();
  lb.hidden = false;
  document.body.style.overflow = "hidden";
  $("#lbClose").focus();
}
function closeLb() {
  stopLbVideo();
  $("#lbPic").innerHTML = "";
  lb.hidden = true;
  document.body.style.overflow = "";
}
function step(d) {
  stopLbVideo();
  cur = (cur + d + list.length) % list.length;
  paintLb();
}
$("#lbClose").onclick = closeLb;
$("#lbPrev").onclick = () => step(-1);
$("#lbNext").onclick = () => step(1);
lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });
document.addEventListener("keydown", e => {
  if (lb.hidden) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

/* ---------- tema ---------- */
$("#themeBtn").onclick = () => {
  const root = document.documentElement;
  const isDark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = isDark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
};
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

$("#mpanel").onclick = e => {

/* ---------- bunga lily + animasi ---------- */
(() => {
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function lily() {
    let p = "", s = "";
    for (let i = 0; i < 6; i++) {
      const a = i * 60;
      p += '<path transform="rotate(' + a + ')" d="M0 0C-10 -12 -15 -34 0 -48C15 -34 10 -12 0 0Z" fill="url(#flg)" stroke="#c96a86" stroke-width=".7"/>' +
           '<path transform="rotate(' + a + ')" d="M0 -6V-34" stroke="#d27a93" stroke-width=".8" fill="none"/>';
      for (let k = 0; k < 5; k++) {
        const off = ((k * 37 + i * 19) % 9) - 4;
        p += '<circle transform="rotate(' + a + ')" cx="' + off * 0.7 + '" cy="' + -(11 + k * 6) + '" r=".9" fill="#a8324f"/>';
      }
    }
    for (let i = 0; i < 5; i++)
      s += '<g transform="rotate(' + (-40 + i * 20) + ')"><line y2="-24" stroke="#d9a066" stroke-width=".8"/><ellipse cy="-26" rx="2" ry="4" fill="#b5651d"/></g>';
    return '<svg viewBox="-50 -50 100 100" aria-hidden="true">' + p + s + '<circle r="3" fill="#cfe0a8"/></svg>';
  }

  const defs = document.createElement("div");
  defs.innerHTML = '<svg class="fl-defs" aria-hidden="true"><defs><linearGradient id="flg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8d0da"/><stop offset="1" stop-color="#de7893"/></linearGradient></defs></svg>';
  document.body.append(defs.firstChild);

  /* bunga di pinggir layar, bergeser halus saat scroll */
  const layer = document.createElement("div");
  layer.className = "fl-layer"; layer.setAttribute("aria-hidden", "true");
  const spots = [
    { l: "-3%", t: "8%", s: 120, ph: 0, d: 1 }, { r: "-4%", t: "30%", s: 110, ph: 2, d: -1 },
    { l: "-4%", t: "58%", s: 100, ph: 4, d: 1 }, { r: "-3%", t: "80%", s: 120, ph: 1, d: -1 }
  ];
  spots.forEach(o => {
    const f = document.createElement("div");
    f.className = "fl"; f.style.setProperty("--s", o.s + "px"); f.style.top = o.t;
    if (o.l) f.style.left = o.l; else f.style.right = o.r;
    f.innerHTML = lily(); o.el = f; layer.append(f);
  });
  document.body.append(layer);

  if (!RM) {
    let tick = false;
    const upd = () => {
      tick = false; const y = scrollY;
      spots.forEach(o => o.el.style.transform = "translateY(" + Math.sin(y / 380 + o.ph) * 46 + "px) rotate(" + y * 0.05 * o.d + "deg)");
    };
    addEventListener("scroll", () => { if (!tick) { tick = true; requestAnimationFrame(upd); } }, { passive: true });
    upd();
  }

  /* lily kecil di hero, bisa di-tap */
  const stack = $("#stack");
  if (stack) ["a", "b"].forEach(c => {
    const l = document.createElement("span");
    l.className = "lily " + c; l.innerHTML = lily(); l.setAttribute("role", "img"); l.setAttribute("aria-label", "bunga lily");
    l.onclick = () => { l.classList.remove("pop"); void l.offsetWidth; l.classList.add("pop"); };
    stack.append(l);
  });

  /* kelopak jatuh pas klik */
  function burst(x, y) {
    if (RM) return;
    for (let i = 0; i < 8; i++) {
      const d = document.createElement("i");
      d.style.cssText = "position:fixed;left:" + x + "px;top:" + y + "px;width:11px;height:15px;border-radius:70% 0 70% 70%;pointer-events:none;z-index:80;background:" + (i % 3 ? "#f0a6b8" : "#f7df8e");
      document.body.append(d);
      const a = Math.random() * Math.PI * 2, r = 30 + Math.random() * 50;
      d.animate([
        { transform: "translate(-50%,-50%) scale(.6) rotate(0)", opacity: 1 },
        { transform: "translate(" + Math.cos(a) * r + "px," + (Math.sin(a) * r + 70) + "px) scale(1) rotate(" + Math.random() * 360 + "deg)", opacity: 0 }
      ], { duration: 900 + Math.random() * 500, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => d.remove();
    }
  }
  document.addEventListener("click", e => {
    const t = e.target.closest(".btn,.chip,.iconbtn,.pol,.socials a,.mail button,.lily");
    if (!t) return;
    let x = e.clientX, y = e.clientY;
    if (!x && !y) { const b = t.getBoundingClientRect(); x = b.left + b.width / 2; y = b.top + b.height / 2; }
    burst(x, y);
  });

  /* muncul pelan pas di-scroll */
  if (!RM && "IntersectionObserver" in window) {
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: 0.12 });
    document.querySelectorAll(".shead,.ticket,.note,.card,.webp .phone").forEach((el, i) => {
      el.classList.add("rv"); el.style.transitionDelay = (i % 3) * 80 + "ms"; io.observe(el);
    });
  }
})();
</script>
